---
# Development environment variables

environment: dev

# Ports
user_api_port: 8080
frontend_port: 3000

# Database
database_url: sqlite:///users.db

# API settings
api_base_url: http://localhost:8080

# Security (dev only - use vault for prod)
secret_key: dev-secret-key-not-for-production

# Logging
log_level: DEBUG

# Resource limits (relaxed for dev)
memory_limit: 256M
cpu_quota: 100%

# Data paths
data_path: /tmp/data/processor

# Service settings
flask_env: development
debug_mode: true
