# Data Processor Service Configuration

# Service settings
service:
  name: data-processor
  version: 1.0.0
  environment: production

# Processing configuration
processing:
  interval_seconds: 60
  batch_size: 100
  max_workers: 4
  timeout_seconds: 300

# Data paths
paths:
  input: /var/data/processor/input
  output: /var/data/processor/output
  archive: /var/data/processor/archive
  logs: /opt/services/data-processor/logs

# Logging configuration
logging:
  level: INFO
  format: '%(asctime)s - %(name)s - %(levelname)s - %(message)s'
  file: /opt/services/data-processor/logs/processor.log
  max_bytes: 10485760  # 10MB
  backup_count: 5

# Database configuration (if needed)
database:
  enabled: false
  host: localhost
  port: 5432
  name: dataprocessor
  user: processor
  password: changeme

# Monitoring
monitoring:
  enabled: true
  metrics_port: 9090
  health_check_interval: 30
