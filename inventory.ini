# Ansible Inventory File
# Defines hosts for different environments

[dev]
dev-server-01 ansible_host=10.10.10.101 ansible_user=ansible

[qa]
qa-server-01 ansible_host=10.10.10.201 ansible_user=ansible
qa-server-02 ansible_host=10.10.10.202 ansible_user=ansible

[prod]
prod-server-01 ansible_host=10.10.10.301 ansible_user=ansible
prod-server-02 ansible_host=10.10.10.302 ansible_user=ansible
prod-server-03 ansible_host=10.10.10.303 ansible_user=ansible

# Group variables
[dev:vars]
environment=dev
docker_registry=localhost:5000

[qa:vars]
environment=qa
docker_registry=localhost:5000

[prod:vars]
environment=prod
docker_registry=localhost:5000

# All servers common settings
[all:vars]
ansible_python_interpreter=/usr/bin/python3
ansible_ssh_common_args='-o StrictHostKeyChecking=no'
